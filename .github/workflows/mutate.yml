name: Beta infrastructure mutation
# The entry event is readable from the run list: operation, `delivery_trigger`, the
# artifact tag and the run that dispatched this one (or the actor for a manual
# dispatch). The `dispatched_by` half is the key the dispatching workflow reads back.
run-name: "Beta ${{ inputs.operation }}: ${{ inputs.delivery_trigger }} · ${{ inputs.service_artifact_tag }} · by ${{ inputs.dispatched_by || format('@{0}', github.actor) }}"
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [deploy-foundation, deploy-billing, deploy-platform, deploy-egress, delete-egress, deploy-runtime, stop-runtime, restore-release, migrate, admission-status, add-testers, set-testers, rearm-object-deletion, publish-client]
        required: true
      service_artifact_tag:
        description: Sealed Service artifact tag; required by deploy-platform, deploy-runtime, restore-release and migrate only
        type: string
        default: ''
      service_commit:
        description: Service source commit the sealed artifact was built from; required with the tag
        type: string
        default: ''
      # The deploy chain's context (#226) and the Client publication chain's (#344).
      # Only `deploy-runtime` accepts `deploy` and only `publish-client` accepts
      # `publish`; both accept the `manual` default with no run URL, and `release`
      # is refused in the credential-free preflight everywhere so a tag-shaped
      # dispatch fails loudly.
      delivery_trigger:
        description: Entry event; deploy (the Service deploy chain) for deploy-runtime, publish (the Client publication chain) for publish-client, or manual. release is refused
        type: choice
        options: [deploy, release, manual, publish]
        default: manual
        required: true
      dispatched_by:
        description: HTTPS run URL of the run that dispatched this one; required for delivery_trigger=deploy or publish, empty for manual
        type: string
        default: ''
      # Issue #344: the Client publication identity. All three belong to
      # `publish-client` alone; every other operation refuses them in the
      # credential-free preflight, so a publication identity cannot ride a
      # deployment. The digest is the SHA-256 of the Client run's
      # `dist/bundle-manifest.json` and is re-hashed here before anything is written.
      client_run_id:
        description: AnyWear-Client publisher run id for publish-client only; a positive integer, empty otherwise
        type: string
        default: ''
      client_run_attempt:
        description: AnyWear-Client publisher run attempt for publish-client only; a positive integer, empty otherwise
        type: string
        default: ''
      client_bundle_digest:
        description: SHA-256 of the Client run's dist/bundle-manifest.json for publish-client only; 64 lowercase hex, empty otherwise
        type: string
        default: ''
      identity_phase:
        description: Identity phase; only deploy-* and restore-release may vary it (deploy-runtime/stop-runtime require roles-added)
        type: choice
        options: [retired, roles-added, legacy]
        default: retired
        required: true
      retention_protection:
        description: Retention protection; only deploy-* and restore-release may vary it
        type: boolean
        default: true
        required: true
      tester_emails:
        description: Explicit email JSON array for add-testers or set-testers; otherwise []
        type: string
        default: '[]'
      # Issue #321: the abandoned object-deletion manifest one rearm-object-deletion
      # run repairs. Both values are copied from the worker's
      # `Object deletion manifest standing state` line, and both are empty on every
      # other operation: their per-operation scope is enforced in the
      # credential-free preflight, so a stray value fails the dispatch loudly.
      object_deletion_manifest_id:
        description: Abandoned manifest UUID for rearm-object-deletion only; empty on every other operation
        type: string
        default: ''
      object_deletion_expected_generation:
        description: The manifest's lease_generation for rearm-object-deletion only; a positive integer, empty otherwise
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: anywear-infra-runtime
  cancel-in-progress: false
  # #226: bounded, non-cancelling serialization. `cancel-in-progress: true` is a
  # workflow validation error with `queue`, so `false` is the only legal pairing.
  # actionlint 1.7.12 rejects the key before it knows it; the reviewed ignore lives
  # in `.github/actionlint.yaml`.
  queue: max
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Single-account constants, not environment configuration: `vars` resolves at
  # repository scope here, and the credential-free `preflight`/`verify` jobs have
  # no `environment:` to resolve environment-scoped variables from. The scripts and
  # validators already hard-code the same account and region.
  AWS_ACCOUNT_ID: '650880818323'
  AWS_REGION: 'ap-east-1'
  CDK_DEFAULT_ACCOUNT: '650880818323'
  CDK_DEFAULT_REGION: 'ap-east-1'
  BILLING_REGION: us-east-1
  # The stage switch must stay repository-scoped: job-level `if` expressions are
  # evaluated before any environment exists, so an environment-scoped value would
  # never open the gate.
  ENABLE_BETA_MUTATION: ${{ vars.ENABLE_BETA_MUTATION }}
  INFRA_OPERATION: ${{ inputs.operation }}
  # Both are passed to every operation unchanged: their per-operation scope is
  # enforced by `validateDeliveryInput` in the credential-free preflight, so a
  # trigger that names an event on another operation is a refusal rather than an
  # input the workflow silently dropped.
  DELIVERY_TRIGGER: ${{ inputs.delivery_trigger }}
  DISPATCHED_BY: ${{ inputs.dispatched_by }}
  SERVICE_ARTIFACT_TAG: ${{ inputs.service_artifact_tag }}
  SERVICE_COMMIT: ${{ inputs.service_commit }}
  # Issue #344: the Client publication identity travels on every operation and its
  # per-operation scope is enforced by `validateClientInputs` in the same
  # credential-free preflight, so a stray value fails the dispatch loudly.
  CLIENT_RUN_ID: ${{ inputs.client_run_id }}
  CLIENT_RUN_ATTEMPT: ${{ inputs.client_run_attempt }}
  CLIENT_BUNDLE_DIGEST: ${{ inputs.client_bundle_digest }}
  # The publication role is a reviewed literal, the way the account and region are
  # pinned: it resolves in every job without an environment, so the credential-free
  # `verify` job can carry it as an inert value and no operator has to create a
  # repository variable for this operation.
  CLIENT_PUBLISH_ROLE_ARN: 'arn:aws:iam::650880818323:role/beta-client-publish-role'
  TESTER_EMAILS: ${{ inputs.tester_emails }}
  OBJECT_DELETION_MANIFEST_ID: ${{ inputs.object_deletion_manifest_id }}
  OBJECT_DELETION_EXPECTED_GENERATION: ${{ inputs.object_deletion_expected_generation }}
  INFRA_IDENTITY_PHASE: ${{ inputs.identity_phase }}
  INFRA_RETENTION_PROTECTION: ${{ inputs.retention_protection }}
  GH_TELEMETRY: disabled
jobs:
  # Reject a forbidden operation, a missing or unexpected Service artifact identity
  # and unreviewed context before any job holds a token, an environment or an OIDC
  # identity.
  preflight:
    if: github.ref == 'refs/heads/main' && vars.ENABLE_BETA_MUTATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Validate operation family and reviewed Service artifact identity
        run: node scripts/check-operation.mjs
  # The only job that reads a published peer artifact. It proves the Service
  # release and its tag ref over the REST API, requires the asset names this
  # operation consumes to be present, uploaded and digest-valid, and downloads only
  # those; and for `publish-client` it proves the AnyWear-Client publisher run and
  # downloads that run's `client-dist` artifact through the REST artifact endpoint.
  # It holds one read-only App token (only when the operation takes a release or a
  # Client bundle) and never an OIDC identity or an environment. It publishes the
  # proven BYTES as the transport artifact and the published DIGESTS as this job's
  # outputs; the deploy job proves both before it requests a credential.
  verify:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      release_assets: ${{ steps.verify.outputs.release_assets }}
      # Issue #344: the digest recomputed over the downloaded bundle manifest. The
      # deploy job re-hashes the travelled bytes against it.
      client_bundle_digest: ${{ steps.client-bundle.outputs.client_bundle_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # The repository-module rule: this job runs `node scripts/client-publication.mjs`
      # for a Client publication, so it installs the pinned dependencies itself
      # before its first module run. The composite below installs them too, exactly
      # as it does inside the `deploy` job, so neither job depends on the other's
      # tree.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - uses: ./.github/actions/verify-operation
        id: verify
        with:
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
      # ADR 0033 §5 allocation 6: one App token narrowed to a read of
      # `AnyWear-Client` with `actions: read` and nothing else. It proves the
      # publisher run and downloads the bundle; it grants no write and no other
      # repository.
      - name: Create the AnyWear-Client publisher read token
        id: client
        if: env.INFRA_OPERATION == 'publish-client'
        uses: actions/create-github-app-token@v3
        with:
          app-id: 3346940
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: AnyWear-Client
          permission-actions: read
      # The Client publisher proof and the one download. It reads the run, its jobs
      # and its artifact list over REST, downloads `client-dist`, extracts it,
      # recomputes the SHA-256 of `dist/bundle-manifest.json`, requires the
      # dispatched digest, and writes the verified tree for the upload below.
      - name: Prove the Client publisher run and recompute the bundle digest
        id: client-bundle
        if: env.INFRA_OPERATION == 'publish-client'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.client.outputs.token }}
        run: node scripts/client-publication.mjs verify
      # Infra's own transport artifact: only the verified Client tree, retained one
      # day, one reader (the deploy job's re-hash below).
      - name: Publish the verified Client bundle as Infra's transport artifact
        if: env.INFRA_OPERATION == 'publish-client'
        uses: actions/upload-artifact@v4
        with:
          name: client-publish-bytes-${{ github.run_id }}-${{ github.run_attempt }}
          path: .client-artifacts/dist
          retention-days: 1
          if-no-files-found: error
  # The only job that acquires AWS credentials. It is scheduled after `verify`; its
  # first work is the #338 admission read — before any AWS credential request — and
  # the `deploy-operation` composite then proves the travelled release bytes against
  # the published digests and strictly loads the schema asset or runtime policy;
  # only then does `runtime-operation.mjs` request the restricted session. A failed
  # or partial mutation leaves a non-success run with no gate step using
  # `continue-on-error`, and a mutation that landed before a later refusal appends one
  # summary line naming the stack it already changed.
  deploy:
    needs: verify
    environment: beta
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    # The role ARNs are environment-scoped repository variables, so they resolve
    # only in this job, the one that declares `beta`. Nothing before it reads them.
    # `VERIFIED_RELEASE_ASSETS` is the verify job's output: the published digest of
    # each asset this operation consumes, and nothing else.
    # `VERIFIED_CLIENT_BUNDLE_DIGEST` is the same job's recomputed Client manifest
    # digest (#344), against which this job re-hashes the travelled bundle.
    env:
      INFRA_DEPLOY_ROLE_ARN: ${{ vars.INFRA_DEPLOY_ROLE_ARN }}
      INFRA_RUNTIME_ROLE_ARN: ${{ vars.INFRA_RUNTIME_ROLE_ARN }}
      VERIFIED_RELEASE_ASSETS: ${{ needs.verify.outputs.release_assets }}
      VERIFIED_CLIENT_BUNDLE_DIGEST: ${{ needs.verify.outputs.client_bundle_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # The repository-module rule: a job that runs `node scripts/...` installs the
      # pinned dependencies first, so a module import cannot fail on a missing tree.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # #338: the pre-mutation admission read. It is the first work after checkout and
      # the dependency install, so it precedes the release-byte download and
      # `./.github/actions/deploy-operation`, and a refusal happens before any AWS
      # credential request. Exactly one read-only App installation token is minted,
      # narrowed to AnyWear-E2E with `actions: read` and nothing else; `deploy` holds
      # the other mutating credential and no part of it is shared with this read.
      - name: Create the AnyWear-E2E gate admission token
        id: admission
        uses: actions/create-github-app-token@v3
        with:
          app-id: 3346940
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: AnyWear-E2E
          permission-actions: read
      # A refusal is a normal failing step: the mutation does not run, and the
      # operator either cancels the gate run that holds the environment or
      # waits and re-runs the deployment. A 30-minute budget bounds the wait.
      - name: Refuse to mutate while a full gate run is nonterminal
        shell: bash
        env:
          GH_TOKEN: ${{ steps.admission.outputs.token }}
        run: node scripts/e2e-admission.mjs
      - name: Download the Service release bytes that travelled from verify
        if: env.INFRA_OPERATION == 'deploy-platform' || env.INFRA_OPERATION == 'restore-release' || env.INFRA_OPERATION == 'deploy-runtime' || env.INFRA_OPERATION == 'migrate'
        uses: actions/download-artifact@v4
        with:
          name: service-release-bytes-${{ github.run_id }}-${{ github.run_attempt }}
          # The upload has a single search path (`.service-artifacts/selected`), so
          # `upload-artifact` uses that directory itself as the artifact root and
          # stores the files at the artifact root. The download must therefore
          # target the same directory, or the bytes would land in the workspace
          # root and `prove-release-bytes.mjs` would fail closed on every release.
          path: .service-artifacts/selected
      # Issue #344: the Client publication consumes no Service release, so the
      # release-byte download and the `deploy-operation` composite are gated out
      # above and below. Its own three steps replace them: the travelled bundle is
      # downloaded, re-hashed under the restricted session and published, and the
      # one publication record is uploaded. `scripts/client-publication.mjs publish`
      # asks the session allow-list before every AWS call.
      - name: Download the verified Client bundle that travelled from verify
        if: env.INFRA_OPERATION == 'publish-client'
        uses: actions/download-artifact@v4
        with:
          name: client-publish-bytes-${{ github.run_id }}-${{ github.run_attempt }}
          # The upload's single search path is `.client-artifacts/dist`, so the
          # download must target the same directory: `s3 sync` writes its contents
          # to the bucket root and the digest is recomputed over
          # `.client-artifacts/dist/bundle-manifest.json`.
          path: .client-artifacts/dist
      - name: Publish the verified Client bundle to Beta
        if: env.INFRA_OPERATION == 'publish-client'
        shell: bash
        run: node scripts/client-publication.mjs publish
      - name: Upload the Client publication record
        if: env.INFRA_OPERATION == 'publish-client'
        uses: actions/upload-artifact@v4
        with:
          name: client-publication-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: .client-publication/publication-record.json
          retention-days: 90
          if-no-files-found: error
      - uses: ./.github/actions/deploy-operation
        if: env.INFRA_OPERATION != 'publish-client'
  # #226/#338/#344: the E2E gate hold. It runs only after `deploy` succeeded for
  # `deploy-runtime` or for `publish-client`. It declares no `environment`, holds no
  # `id-token` and no AWS permission, and mints exactly one App installation token,
  # narrowed to AnyWear-E2E with `actions: write` only; that one token both
  # dispatches the gate run and reads the dispatched run back.
  #
  # For `delivery_trigger=deploy` (Runtime) and `delivery_trigger=publish` (Client)
  # the job is the hold: after the dispatch step — which exposes the created run's id
  # and URL and the dispatch receipt as its step outputs — the final step observes
  # that run to a terminal state, so this run, and with it
  # `anywear-infra-runtime`, stays alive for the gate run instead of releasing
  # the environment to the next writer. The observation's ceiling is 55 minutes
  # measured from the moment the dispatched run was created, under the one-hour
  # lifetime of the token minted immediately before the dispatch; the job's 65-minute
  # timeout is longer, so the deadline fires first and the recorder still runs. The
  # hold records exactly one outcome — `passed`, `failed` or `unobserved` —
  # in the step summary and the job output: `unobserved` means the dispatched run
  # could not be read, so no verdict was formed and the step fails, while a red
  # gate run leaves the deployment's (or publication's) own success standing.
  # `delivery_trigger=manual` dispatches a `smoke` and takes no hold. The dispatch step
  # precedes the observation and the observation is the job's last step.
  e2e-hold:
    needs: deploy
    if: success() && (inputs.operation == 'deploy-runtime' || inputs.operation == 'publish-client')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
    # ADR 0033 §7's "job output": the one `passed`/`failed`/`unobserved`
    # outcome this run records, readable from the workflow run without opening the
    # step summary.
    outputs:
      outcome: ${{ steps.observe.outputs.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # The repository-module rule: a job that runs `node scripts/...` installs the
      # pinned dependencies first, so a module import cannot fail on a missing tree.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Create the AnyWear-E2E gate dispatch token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: 3346940
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: AnyWear-E2E
          permission-actions: write
      # The dispatch with `return_run_details: true`, the created run verified by id
      # and the run-name poll used only when the response names no run id are one
      # step. The dispatch is made on every invocation — a re-run is a deliberate
      # redeploy that `anywear-infra-runtime` orders behind the holder — so there is
      # no pre-dispatch lookup. It exposes the created run's id and URL as its step
      # outputs, which the observation below reads, plus the dispatch receipt
      # (`created`, `not_submitted` or `acceptance_unknown`) so the recorder can tell
      # "nothing was submitted" from "a run may exist that this step cannot name".
      - name: Dispatch the deploy chain's gate run and print its run
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/e2e-dispatch.mjs
      # #338: the observation is the job's last step and runs even when an earlier
      # step failed, so every hold that ran leaves exactly one outcome. It records
      # `failed` and exits zero when the dispatch receipt proves nothing was
      # submitted (the job is already red from the step that failed); a dispatched
      # run it cannot read records `unobserved` and fails the job; a terminal
      # non-success run, the 55-minute ceiling and `passed` record their one
      # outcome and exit zero. Its `outcome` is the job output above.
      - name: Observe the dispatched gate run and record its one outcome
        id: observe
        if: always() && (env.INFRA_OPERATION == 'deploy-runtime' && env.DELIVERY_TRIGGER == 'deploy' || env.INFRA_OPERATION == 'publish-client' && env.DELIVERY_TRIGGER == 'publish')
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          E2E_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
          E2E_RUN_URL: ${{ steps.dispatch.outputs.run_url }}
          E2E_RECEIPT: ${{ steps.dispatch.outputs.receipt }}
        run: node scripts/e2e-observe.mjs
