name: Future gated Production promotion
on:
  # Not an entry: this file stays source-disabled and is callable only. Its
  # tested pre-AWS blocker and tests remain; a future reviewed onboarding adds the
  # dispatch surface together with the Production role and verifier contract.
  workflow_call:
permissions:
  contents: read
concurrency:
  group: anywear-infra-runtime
  cancel-in-progress: false
jobs:
  promotion:
    # #54 does not enable this gate, install the Production role or mutate Prod.
    if: github.ref == 'refs/heads/main'
    # No `environment:` here: this repository has no registered `prod`
    # environment, so naming one would let the first dispatch materialise an
    # unprotected one. A future reviewed onboarding restores the environment
    # protection together with removing the source blocker.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      CDK_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      PROD_DEPLOY_ROLE_ARN: ${{ vars.PROD_DEPLOY_ROLE_ARN }}
      # Issue #358: the AnyWear-E2E `full` gate run this promotion dispatched and
      # holds. The id and attempt come from that dispatch's `return_run_details`
      # response in a future entry; they are variables here only so the disabled
      # gate can be exercised and read back.
      E2E_GATE_RUN_ID: ${{ vars.E2E_GATE_RUN_ID }}
      E2E_GATE_RUN_ATTEMPT: ${{ vars.E2E_GATE_RUN_ATTEMPT }}
      STABLE_RELEASE_ID: ${{ vars.PROD_STABLE_RELEASE_ID }}
      SERVICE_RELEASE_ID: ${{ vars.PROD_SERVICE_RELEASE_ID }}
      SERVICE_SOURCE_SHA: ${{ vars.PROD_SERVICE_SOURCE_SHA }}
      SERVICE_IMAGE_DIGEST: ${{ vars.PROD_SERVICE_IMAGE_DIGEST }}
      GH_TELEMETRY: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require separately reviewed Production executor onboarding before credentials or artifact access
        run: node scripts/promote-production.mjs
      - run: npm ci
      # The one App token reads the AnyWear-Service release facts and the
      # AnyWear-E2E gate run this promotion holds. It no longer downloads a gate
      # artifact and no longer checks out the AnyWear-E2E verifier: the run object
      # itself is the verdict (#358).
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: 3346940
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            AnyWear-Service
            AnyWear-E2E
          permission-contents: read
          permission-actions: read
          permission-attestations: read
      - name: Resolve the reviewed release identity, stable release and the gate run before AWS credentials
        id: gate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/production-preflight.mjs resolve
      # Execution stays source-disabled in scripts/promote-production.mjs, which
      # runs before credentials and cannot be bypassed by an activation variable.
      # The preflight reads the sealed Service release identity, the stable release
      # and the AnyWear-E2E `full` gate run this promotion dispatched and holds; the
      # run object is the gate verdict, and no record or artifact is read. A future
      # reviewed onboarding PR must supply scoped cross-account credentials,
      # Production DB observation, scan/retention evidence and compute-only recovery.
